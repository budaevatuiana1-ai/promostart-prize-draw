<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Розыгрыш победителей</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Розыгрыш победителей</h1>

    <label for="count">Количество участников</label>
    <div class="row">
      <input
        id="count"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        placeholder="Например, 300"
      >
      <button id="drawBtn" class="primary" type="button">Выбрать победителя</button>
    </div>
    <p id="error" class="error" hidden aria-live="polite"></p>

    <div id="winnerBox" class="winner-box" hidden aria-live="polite">
      <span class="winner-label">Победитель</span>
      <div id="winnerNumber" class="winner-number">—</div>
    </div>

    <p id="status" class="status"></p>

    <section id="winnersSection" hidden>
      <h2>Список победителей: <span id="winnersCount">0</span></h2>
      <ol id="winnersList" class="winners-list"></ol>
    </section>

    <button id="resetBtn" class="reset" type="button" hidden>Новый розыгрыш</button>
  </main>

  <script src="app.js"></script>
</body>
</html>
